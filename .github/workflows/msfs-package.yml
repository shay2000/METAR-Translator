name: Build MSFS 2020 Community Package

# SDK-compiled build, kept as the CI mirror of build.bat for anyone who has the
# simulator installed. It cannot publish releases: publishing for msfs-v* tags is
# owned by msfs-release.yml so that only one workflow ever writes the asset.
#
# Manual dispatch only, because fspackagetool.exe reads the Steam/MSFS install
# path out of the registry and fails with "failed to locate the Steam
# installation path" on GitHub-hosted runners, which have no game installed. It
# therefore cannot pass on windows-latest and used to make every push to main
# red. Nothing is lost by not running it on push:
#   - the tests and source validation also run in msfs-integration.yml, on both
#     ubuntu-latest and windows-latest, for these same paths;
#   - the released ZIP is built by msfs-release.yml, which packages the panel
#     without the SDK.
# To actually compile with the SDK, dispatch this on a self-hosted Windows runner
# that has MSFS 2020 and the SDK installed.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: msfs-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows package
    runs-on: windows-latest

    defaults:
      run:
        working-directory: integrations/msfs2020

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      # The tests and source validation need no SDK, so they run first. That way a
      # vendor-side SDK outage can never stop the panel itself from being checked.
      - name: Run package tests
        shell: cmd
        run: node --test

      - name: Validate package source
        shell: cmd
        run: node tools\validate-source.mjs .

      - name: Download the MSFS 2020 SDK core installer
        id: sdk
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'

          # The official feed lists game versions newest-first, but the installer it
          # advertises is not always on the CDN: the newest entry resolved to
          # 0.24.6, which returns HTTP 404, and that failed every run. So try the
          # newest few entries and keep the first installer that really downloads
          # rather than trusting one URL.
          $metadata = Invoke-RestMethod -Uri 'https://sdk.flightsimulator.com/files/sdk.json'

          $candidates = @($metadata.game_versions) |
            ForEach-Object { $_.downloads_menu.'SDK Installer (Core)'.value } |
            Where-Object { -not [string]::IsNullOrWhiteSpace($_) } |
            Select-Object -Unique |
            Select-Object -First 5

          if (-not $candidates) {
            throw 'The official SDK metadata did not contain a core installer URL.'
          }

          $installer = Join-Path $env:RUNNER_TEMP 'MSFS_SDK_Core.msi'

          foreach ($candidate in $candidates) {
            $url = "https://sdk.flightsimulator.com/files/$candidate"

            try {
              Invoke-WebRequest -Uri $url -OutFile $installer
              Write-Host "Downloaded the SDK core installer from $url."
              "installer=$installer" >> $env:GITHUB_OUTPUT
              "available=true" >> $env:GITHUB_OUTPUT
              exit 0
            }
            catch {
              $reason = $_.Exception.Message
              Write-Host "::warning::$url could not be downloaded ($reason). Trying the previous SDK version."
            }
          }

          # A broken vendor feed is not this repository's fault, and releases are
          # built by msfs-release.yml without the SDK, so skip rather than fail.
          "available=false" >> $env:GITHUB_OUTPUT
          Write-Host '::warning::No MSFS 2020 SDK core installer could be downloaded, so the SDK build was skipped. The tests and source validation above still ran.'

      - name: Install MSFS 2020 SDK core
        if: steps.sdk.outputs.available == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $installer = '${{ steps.sdk.outputs.installer }}'
          $arguments = "/i `"$installer`" /qn /norestart"
          $process = Start-Process -FilePath 'msiexec.exe' -ArgumentList $arguments -Wait -PassThru

          if ($process.ExitCode -notin @(0, 3010)) {
            throw "MSFS SDK installation failed with exit code $($process.ExitCode)."
          }

          $sdkRoot = 'C:\MSFS SDK'
          $packageTool = Join-Path $sdkRoot 'Tools\bin\fspackagetool.exe'
          if (-not (Test-Path -LiteralPath $packageTool)) {
            throw "The SDK installer completed, but fspackagetool.exe was not found at $packageTool."
          }

          "MSFS_SDK=$sdkRoot" >> $env:GITHUB_ENV
          Write-Host "MSFS SDK installed at $sdkRoot."

      - name: Build and zip Community package
        if: steps.sdk.outputs.available == 'true'
        shell: cmd
        run: build.bat "%MSFS_SDK%"

      - name: Upload ZIP artifact
        if: steps.sdk.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: metar-viewer-msfs-2020-sdk-${{ github.sha }}
          path: integrations/msfs2020/Packages/metar-viewer-toolbar.zip
          if-no-files-found: error
          retention-days: 30
