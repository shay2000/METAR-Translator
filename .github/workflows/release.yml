name: Release all platforms

# Creates the version tags and then publishes THREE separate GitHub Releases.
# Each platform has its own version sequence:
#
#   win-vX.Y.Z   -> METAR Viewer for Windows      (.exe)   windows-release.yml
#   mac-vX.Y.Z   -> METAR Viewer for Mac          (.dmg)   mac-release.yml
#   msfs-vX.Y.Z  -> METAR Viewer for MSFS 2020    (.zip)   msfs-release.yml
#
# WHY THIS WORKFLOW CALLS THE OTHERS INSTEAD OF JUST PUSHING TAGS
# GitHub deliberately does NOT raise workflow-triggering events for refs created
# with the default GITHUB_TOKEN, to stop workflows recursively triggering
# themselves. The previous auto-release.yml pushed a `v*` tag and expected the
# tag-triggered release workflow to pick it up; that never happened, which is why
# v1.0.3 through v1.0.6 were tagged but only ever released by hand. Using
# `workflow_call` invokes each platform workflow in-process, so no event delivery
# is involved and no personal access token is needed.
#
# Each platform workflow keeps its own `push: tags:` trigger, so pushing a tag
# manually (`git push origin mac-v1.2.3`) still releases just that one platform.

on:
  # Every code change to main ships all three platforms.
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  workflow_dispatch:
    inputs:
      version:
        description: "Optional shared version override, for example 1.0.7. Leave blank to bump each track independently."
        required: false
        type: string

permissions:
  contents: read

# Serialised: two concurrent runs would race to allocate the same version number.
concurrency:
  group: release-all
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # JOB 1: Allocate one version per platform and create all three tags up front,
  # so the platform jobs below can each check out a tag that already exists.
  # ---------------------------------------------------------------------------
  tag:
    name: Create release tags
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      windows_version: ${{ steps.version.outputs.windows_version }}
      mac_version: ${{ steps.version.outputs.mac_version }}
      msfs_version: ${{ steps.version.outputs.msfs_version }}
      windows_tag: ${{ steps.version.outputs.windows_tag }}
      mac_tag: ${{ steps.version.outputs.mac_tag }}
      msfs_tag: ${{ steps.version.outputs.msfs_tag }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history so every existing tag is visible.

      - name: Resolve the next version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          next_version() {
            local highest

            highest="$(
              git tag -l "$@" \
                | sed -E 's/^(win-|mac-|msfs-)?v//' \
                | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
                | sort -V \
                | tail -n 1 \
                || true
            )"
            highest="${highest:-0.0.0}"

            IFS='.' read -r MAJOR MINOR PATCH <<< "$highest"
            echo "${MAJOR}.${MINOR}.$((PATCH + 1))"
          }

          assert_available() {
            local tag="$1"
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "::error::Tag $tag already exists. Pick another version or leave the input blank."
              exit 1
            fi
          }

          if [[ -n "$REQUESTED_VERSION" ]]; then
            VERSION="${REQUESTED_VERSION#v}"

            if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Version must be MAJOR.MINOR.PATCH, for example 1.0.7. Got '$REQUESTED_VERSION'."
              exit 1
            fi

            WINDOWS_VERSION="$VERSION"
            MAC_VERSION="$VERSION"
            MSFS_VERSION="$VERSION"
          else
            # Legacy unprefixed v tags belong to the Windows release line.
            # Mac and MSFS each start from their own prefixed tag history.
            WINDOWS_VERSION="$(next_version 'v*' 'win-v*')"
            MAC_VERSION="$(next_version 'mac-v*')"
            MSFS_VERSION="$(next_version 'msfs-v*')"
          fi

          WINDOWS_TAG="win-v$WINDOWS_VERSION"
          MAC_TAG="mac-v$MAC_VERSION"
          MSFS_TAG="msfs-v$MSFS_VERSION"

          assert_available "$WINDOWS_TAG"
          assert_available "$MAC_TAG"
          assert_available "$MSFS_TAG"

          echo "Releasing Windows $WINDOWS_VERSION, macOS $MAC_VERSION, MSFS 2020 $MSFS_VERSION"

          {
            echo "windows_version=$WINDOWS_VERSION"
            echo "mac_version=$MAC_VERSION"
            echo "msfs_version=$MSFS_VERSION"
            echo "windows_tag=$WINDOWS_TAG"
            echo "mac_tag=$MAC_TAG"
            echo "msfs_tag=$MSFS_TAG"
          } >> "$GITHUB_OUTPUT"

      - name: Create and push the three tags
        env:
          WINDOWS_TAG: ${{ steps.version.outputs.windows_tag }}
          MAC_TAG: ${{ steps.version.outputs.mac_tag }}
          MSFS_TAG: ${{ steps.version.outputs.msfs_tag }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          for TAG in "$WINDOWS_TAG" "$MAC_TAG" "$MSFS_TAG"; do
            git tag "$TAG"
          done

          # One atomic push: if any tag is rejected, none are created, so the
          # three platform tags always point at the same source commit.
          git push --atomic origin \
            "$WINDOWS_TAG" \
            "$MAC_TAG" \
            "$MSFS_TAG"

          echo "Created $WINDOWS_TAG, $MAC_TAG, and $MSFS_TAG."

  # ---------------------------------------------------------------------------
  # JOBS 2-4: One independent release per platform. They run in parallel, and
  # `fail-fast` does not apply across jobs, so a Windows build failure still
  # lets the Mac and MSFS releases publish.
  # ---------------------------------------------------------------------------
  windows:
    name: Windows release
    needs: tag
    uses: ./.github/workflows/windows-release.yml
    permissions:
      contents: write
    with:
      tag: ${{ needs.tag.outputs.windows_tag }}

  macos:
    name: macOS release
    needs: tag
    uses: ./.github/workflows/mac-release.yml
    permissions:
      contents: write
    with:
      tag: ${{ needs.tag.outputs.mac_tag }}

  msfs:
    name: MSFS 2020 release
    needs: tag
    uses: ./.github/workflows/msfs-release.yml
    permissions:
      contents: write
    with:
      tag: ${{ needs.tag.outputs.msfs_tag }}

  # ---------------------------------------------------------------------------
  # JOB 5: Summarise what shipped, and fail if any track did not publish.
  # ---------------------------------------------------------------------------
  summary:
    name: Release summary
    if: always()
    needs:
      - tag
      - windows
      - macos
      - msfs
    runs-on: ubuntu-latest

    steps:
      - name: Report per-platform results
        env:
          WINDOWS_VERSION: ${{ needs.tag.outputs.windows_version }}
          MAC_VERSION: ${{ needs.tag.outputs.mac_version }}
          MSFS_VERSION: ${{ needs.tag.outputs.msfs_version }}
          WINDOWS_TAG: ${{ needs.tag.outputs.windows_tag }}
          MAC_TAG: ${{ needs.tag.outputs.mac_tag }}
          MSFS_TAG: ${{ needs.tag.outputs.msfs_tag }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
          MACOS_RESULT: ${{ needs.macos.result }}
          MSFS_RESULT: ${{ needs.msfs.result }}
        run: |
          set -euo pipefail

          {
            echo "## Platform releases"
            echo ""
            echo "| Platform | Version | Tag | Result |"
            echo "| --- | --- | --- | --- |"
            echo "| Windows | $WINDOWS_VERSION | \`$WINDOWS_TAG\` | $WINDOWS_RESULT |"
            echo "| macOS | $MAC_VERSION | \`$MAC_TAG\` | $MACOS_RESULT |"
            echo "| MSFS 2020 | $MSFS_VERSION | \`$MSFS_TAG\` | $MSFS_RESULT |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$WINDOWS_RESULT" != "success" || "$MACOS_RESULT" != "success" || "$MSFS_RESULT" != "success" ]]; then
            echo "::error::At least one platform release did not publish. See the table in the run summary."
            exit 1
          fi

          echo "All three platform releases published."
