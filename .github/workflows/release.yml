name: Release all platforms

# Creates the version tags and then publishes THREE separate GitHub Releases:
#
#   win-vX.Y.Z   -> METAR Viewer for Windows      (.exe)   windows-release.yml
#   mac-vX.Y.Z   -> METAR Viewer for Mac          (.dmg)   mac-release.yml
#   msfs-vX.Y.Z  -> METAR Viewer for MSFS 2020    (.zip)   msfs-release.yml
#
# WHY THIS WORKFLOW CALLS THE OTHERS INSTEAD OF JUST PUSHING TAGS
# GitHub deliberately does NOT raise workflow-triggering events for refs created
# with the default GITHUB_TOKEN, to stop workflows recursively triggering
# themselves. The previous auto-release.yml pushed a `v*` tag and expected the
# tag-triggered release workflow to pick it up; that never happened, which is why
# v1.0.3 through v1.0.6 were tagged but only ever released by hand. Using
# `workflow_call` invokes each platform workflow in-process, so no event delivery
# is involved and no personal access token is needed.
#
# Each platform workflow keeps its own `push: tags:` trigger, so pushing a tag
# manually (`git push origin mac-v1.2.3`) still releases just that one platform.

on:
  # Every code change to main ships all three platforms.
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, for example 1.0.7. Leave blank to bump the patch automatically."
        required: false
        type: string

permissions:
  contents: read

# Serialised: two concurrent runs would race to allocate the same version number.
concurrency:
  group: release-all
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # JOB 1: Allocate one version number and create all three tags up front, so
  # the platform jobs below can each check out a tag that already exists.
  # ---------------------------------------------------------------------------
  tag:
    name: Create release tags
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      windows_tag: ${{ steps.version.outputs.windows_tag }}
      mac_tag: ${{ steps.version.outputs.mac_tag }}
      msfs_tag: ${{ steps.version.outputs.msfs_tag }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history so every existing tag is visible.

      - name: Resolve the next version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [[ -n "$REQUESTED_VERSION" ]]; then
            VERSION="${REQUESTED_VERSION#v}"

            if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Version must be MAJOR.MINOR.PATCH, for example 1.0.7. Got '$REQUESTED_VERSION'."
              exit 1
            fi
          else
            # Consider every track, plus the legacy `v*` tags, and take the single
            # highest version. Sorting the bare numbers keeps the three tracks on
            # one shared version line, so win-v1.0.7 / mac-v1.0.7 / msfs-v1.0.7
            # always describe the same commit.
            #
            # `git tag --sort` is used rather than `git describe`, which only sees
            # tags reachable from HEAD: after the branch consolidation that made it
            # report v1.0.2 while v1.0.6 already existed, so every run then died on
            # "fatal: tag 'v1.0.3' already exists".
            HIGHEST="$(
              git tag -l 'v*' 'win-v*' 'mac-v*' 'msfs-v*' \
                | sed -E 's/^(win-|mac-|msfs-)?v//' \
                | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
                | sort -V \
                | tail -n 1
            )"
            HIGHEST="${HIGHEST:-0.0.0}"

            IFS='.' read -r MAJOR MINOR PATCH <<< "$HIGHEST"
            VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi

          # Never reuse a version where ANY of the three tags is already taken, so
          # a half-finished earlier release can not make this run fail.
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          while true; do
            CANDIDATE="${MAJOR}.${MINOR}.${PATCH}"
            COLLISION=false

            for PREFIX in win-v mac-v msfs-v; do
              if git rev-parse -q --verify "refs/tags/${PREFIX}${CANDIDATE}" >/dev/null; then
                COLLISION=true
                break
              fi
            done

            if [[ "$COLLISION" == false ]]; then
              break
            fi

            if [[ -n "$REQUESTED_VERSION" ]]; then
              echo "::error::Version $CANDIDATE is already released. Delete its tags or pick another version."
              exit 1
            fi

            PATCH=$((PATCH + 1))
          done

          VERSION="$CANDIDATE"
          echo "Releasing version $VERSION"

          {
            echo "version=$VERSION"
            echo "windows_tag=win-v$VERSION"
            echo "mac_tag=mac-v$VERSION"
            echo "msfs_tag=msfs-v$VERSION"
          } >> "$GITHUB_OUTPUT"

      - name: Create and push the three tags
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          for PREFIX in win-v mac-v msfs-v; do
            git tag "${PREFIX}${VERSION}"
          done

          # One atomic push: if any tag is rejected, none are created, so the
          # three tracks can never drift apart.
          git push --atomic origin \
            "win-v${VERSION}" \
            "mac-v${VERSION}" \
            "msfs-v${VERSION}"

          echo "Created win-v${VERSION}, mac-v${VERSION}, and msfs-v${VERSION}."

  # ---------------------------------------------------------------------------
  # JOBS 2-4: One independent release per platform. They run in parallel, and
  # `fail-fast` does not apply across jobs, so a Windows build failure still
  # lets the Mac and MSFS releases publish.
  # ---------------------------------------------------------------------------
  windows:
    name: Windows release
    needs: tag
    uses: ./.github/workflows/windows-release.yml
    permissions:
      contents: write
    with:
      tag: ${{ needs.tag.outputs.windows_tag }}

  macos:
    name: macOS release
    needs: tag
    uses: ./.github/workflows/mac-release.yml
    permissions:
      contents: write
    with:
      tag: ${{ needs.tag.outputs.mac_tag }}

  msfs:
    name: MSFS 2020 release
    needs: tag
    uses: ./.github/workflows/msfs-release.yml
    permissions:
      contents: write
    with:
      tag: ${{ needs.tag.outputs.msfs_tag }}

  # ---------------------------------------------------------------------------
  # JOB 5: Summarise what shipped, and fail if any track did not publish.
  # ---------------------------------------------------------------------------
  summary:
    name: Release summary
    if: always()
    needs:
      - tag
      - windows
      - macos
      - msfs
    runs-on: ubuntu-latest

    steps:
      - name: Report per-platform results
        env:
          VERSION: ${{ needs.tag.outputs.version }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
          MACOS_RESULT: ${{ needs.macos.result }}
          MSFS_RESULT: ${{ needs.msfs.result }}
        run: |
          set -euo pipefail

          {
            echo "## Release $VERSION"
            echo ""
            echo "| Platform | Tag | Result |"
            echo "| --- | --- | --- |"
            echo "| Windows | \`win-v$VERSION\` | $WINDOWS_RESULT |"
            echo "| macOS | \`mac-v$VERSION\` | $MACOS_RESULT |"
            echo "| MSFS 2020 | \`msfs-v$VERSION\` | $MSFS_RESULT |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$WINDOWS_RESULT" != "success" || "$MACOS_RESULT" != "success" || "$MSFS_RESULT" != "success" ]]; then
            echo "::error::At least one platform release did not publish. See the table in the run summary."
            exit 1
          fi

          echo "All three releases published for $VERSION."
