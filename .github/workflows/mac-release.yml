name: Build macOS Release

on:
  push:
    branches:
      - Mac-Version
    tags:
      - "mac-v*"
    paths:
      - ".github/workflows/mac-release.yml"
      - "packaging/macos/**"
      - "scripts/package-macos.sh"
      - "src/**"
      - "tests/**"
      - "Directory.Build.props"
      - "global.json"
      - "MetarViewer.sln"
  workflow_dispatch:
    inputs:
      tag:
        description: "Mac release tag, for example mac-v1.0.0"
        required: true
        type: string

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/Mac-Version' }}

permissions:
  contents: read

jobs:
  test:
    name: Validate and test
    runs-on: macos-14
    outputs:
      is_release: ${{ steps.release.outputs.is_release }}
      source_sha: ${{ steps.release.outputs.source_sha }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Check out Mac source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'Mac-Version' || github.ref }}
          fetch-depth: 0

      - name: Resolve build version
        id: release
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            TAG="$DISPATCH_TAG"
            IS_RELEASE=true
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
            IS_RELEASE=true
          else
            TAG=""
            IS_RELEASE=false
          fi

          if [[ "$IS_RELEASE" == true ]]; then
            [[ "$TAG" =~ ^mac-v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
              echo "Release tag must match mac-vX.Y.Z." >&2
              exit 1
            }
            VERSION="${TAG#mac-v}"

            if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]] &&
               git rev-parse --verify --quiet "refs/tags/$TAG^{commit}" >/dev/null; then
              git checkout --detach "$TAG"
            fi

            git fetch origin Mac-Version
            SOURCE_SHA="$(git rev-parse HEAD)"
            git merge-base --is-ancestor "$SOURCE_SHA" origin/Mac-Version || {
              echo "Mac releases must point to a commit on Mac-Version." >&2
              exit 1
            }
          else
            VERSION="0.0.${GITHUB_RUN_NUMBER}"
            SOURCE_SHA="$(git rev-parse HEAD)"
          fi

          echo "is_release=$IS_RELEASE" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test solution
        run: dotnet test MetarViewer.sln --configuration Release

  package:
    name: Package macOS (${{ matrix.label }})
    needs: test
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Apple Silicon
            runtime: osx-arm64
          - label: Intel
            runtime: osx-x64

    steps:
      - name: Check out Mac source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.test.outputs.source_sha }}

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build, sign, and verify DMG
        run: |
          bash scripts/package-macos.sh \
            "${{ matrix.runtime }}" \
            "${{ needs.test.outputs.version }}" \
            "$GITHUB_RUN_NUMBER" \
            "artifacts/macos/${{ matrix.runtime }}"

      - name: Upload verified DMG
        uses: actions/upload-artifact@v4
        with:
          name: metar-viewer-macos-${{ matrix.runtime }}-${{ needs.test.outputs.version }}
          path: |
            artifacts/macos/${{ matrix.runtime }}/*.dmg
            artifacts/macos/${{ matrix.runtime }}/*.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish Mac release
    if: needs.test.outputs.is_release == 'true'
    needs:
      - test
      - package
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download verified DMGs
        uses: actions/download-artifact@v4
        with:
          pattern: metar-viewer-macos-*
          path: release-assets
          merge-multiple: true

      - name: Create or update explicit Mac release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.test.outputs.tag }}
          SOURCE_SHA: ${{ needs.test.outputs.source_sha }}
        run: |
          set -euo pipefail

          # --latest=false keeps the Windows release track as the repository's
          # "Latest" release, so the three tracks stay independent.
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$SOURCE_SHA" \
              --latest=false \
              --title "METAR Viewer for Mac ${RELEASE_TAG#mac-v}" \
              --notes "macOS release of METAR Viewer. Choose Apple-Silicon for M-series Macs or Intel for Intel-based Macs. These builds use an ad-hoc signature; on first launch, Control-click the app and choose Open."
          fi

          gh release upload "$RELEASE_TAG" release-assets/* \
            --clobber \
            --repo "$GITHUB_REPOSITORY"
